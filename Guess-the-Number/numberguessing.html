 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number guessing</title>
        <link rel="stylesheet" href="numberguessing.css">
 </head>
 <body>
     <nav>
        <a href="/" aria-current="page"> HOME</a>
        <a target="_blank" href="https://github.com/Gayatrisabat"> GitHub</a>
    </nav>
    <div id="wrapper"> 
        <h1>Number guessing game</h1>
        <p>Try and guess a random number between 1 to 100 . </p>
        <p>You have 10 attempts to guess the number!!</p>
        <br>
            <form class="form" > 
                <label for="guessfield" id="guess">Guess a number</label> <br>
                <input type="text" id="guessfield" class="guessfield"><br>
                <input type="submit" id="subt" value="Submit guess" class="guessSubmit" onsubmit="checkGuess()" onsubmit="remainingGuess()">
            </form>
            <div id="showResult" class="showResult"></div>
            <div class="resultParas">
                <p> <h3><b>Previous Guesses : <span class="lastResult"></span></b></p> 
                  <p><b> Guesses Remaining : <span class="guesses"></span></b></h3></p>
                  <p class="lowOrHi"></p>
            </div>
    </div>

    <script src="numberguessing.js"></script>
 </body>
 </html>
